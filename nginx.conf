# HTTP -> HTTPS redirect + wildcard SSL.
# Certificado: certbot certonly --dns-cloudflare (o tu DNS) -d agencia.es -d "*.agencia.es"
# Descomenta el bloque server 443 cuando tengas el cert.

server {
    listen 80;
    server_name agencia.es *.agencia.es;
    # ACME challenge puede ir aquí si usas webroot; con DNS-01 no es necesario
    return 301 https://$host$request_uri;
}

