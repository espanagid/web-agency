name: AI File Writer

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  generate-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate files via AI
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'EOF'
          import os, re, json, urllib.request

          title = os.environ['ISSUE_TITLE']
          body = os.environ['ISSUE_BODY']
          api_key = os.environ['DEEPSEEK_API_KEY']

          system_prompt = """Ты помощник по документации проекта web-agency.
          Отвечай ТОЛЬКО файлами в формате:
          ---FILE: path/to/file.ext---
          [содержимое файла]
          ---END---
          Можно выводить несколько файлов подряд."""

          payload = {
              "model": "deepseek-chat",
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": f"Задача: {title}\n\n{body}"}
              ],
              "temperature": 0.3
          }

          req = urllib.request.Request(
              "https://api.deepseek.com/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {api_key}"
              }
          )

          with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read())

          content = result['choices'][0]['message']['content']
          print("AI response received")
          print(content)

          pattern = r'---FILE:\s*(.+?)---\n(.*?)\n---END---'
          matches = re.findall(pattern, content, re.DOTALL)

          for path, file_content in matches:
              path = path.strip()
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(file_content.strip())
              print(f"Created: {path}")
          EOF

      - name: Commit and push
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "AI: files for #${{ github.event.issue.number }}"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Файлы сгенерированы и закоммичены.'
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
